name: Refresh and Deploy Colombia Force Archive

on:
  schedule:
    # 08:11 a. m. y 06:11 p. m. hora Colombia (UTC-5) = 13:11 UTC y 23:11 UTC
    - cron: "11 13 * * *"
    - cron: "11 23 * * *"
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Fetch latest wars from DomiStats (page 1)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/update_wars.py

      - name: Commit updated war database if changed
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet data/wars.json; then
            echo "No new changes in data/wars.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wars.json
          git commit -m "chore: update Colombia Force war archive ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
