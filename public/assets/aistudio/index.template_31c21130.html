<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1422">
<title>COLOMBIA FORCE · Historial de guerras</title>
<style>
:root{color-scheme:dark;--bg:#0b1422;--surface:#111e2e;--line:#26384b;--text:#f3f6f8;--muted:#9aabba;--lime:#c6f36b;--green:#8cdda9;--red:#ff9292;--gold:#f0c978;--blue:#8ecbff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 78% -12%,#213754 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--lime)}.wrap{max-width:1320px;margin:0 auto;padding:34px 28px 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.brand{display:flex;align-items:center;gap:10px}.crest{width:28px;height:28px;border:1px solid #57713f;border-radius:9px;background:linear-gradient(145deg,#c6f36b,#829d43);display:grid;place-items:center;color:#17210c;font-weight:900;letter-spacing:0}
h1{margin:24px 0 4px;font-size:clamp(30px,5vw,48px);line-height:1.05;letter-spacing:-.04em}.sub{color:var(--muted);margin:10px 0 0}.sub strong{color:#e4edf3;font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:28px 0 26px}.metric{background:linear-gradient(160deg,#142336,#101b2a);border:1px solid var(--line);border-radius:15px;padding:17px 18px;min-height:94px}.metric label{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.09em}.metric strong{display:block;font-size:29px;line-height:1.2;margin-top:8px;font-variant-numeric:tabular-nums}.metric.win strong{color:var(--green)}.metric.loss strong{color:var(--red)}
.toolbar{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:18px 0;border-top:1px solid var(--line)}.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap;flex:1}.field{display:grid;gap:6px}.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
input,select,button{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:9px;min-height:42px;padding:9px 12px}input{width:min(330px,80vw)}select{min-width:150px}button{cursor:pointer;font-weight:650}button:hover{border-color:#64804d;background:#1a2c40}.primary{background:var(--lime);border-color:var(--lime);color:#17210c}.primary:hover{background:#d5ff88;color:#17210c}
.countline{color:var(--muted);font-size:13px;padding:0 0 12px}.list{display:grid;gap:10px}.war{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,.7fr) minmax(0,1fr);gap:16px;align-items:center;background:linear-gradient(115deg,#142235,#111d2c);border:1px solid var(--line);border-radius:14px;padding:16px 18px;transition:border-color .15s}.war:hover{border-color:#4a647b}.side{min-width:0}.side.right{text-align:right}.club{font-size:17px;font-weight:700;overflow-wrap:anywhere}.side-meta{color:var(--muted);font-size:12px;margin-top:4px}.side-meta b{color:#dce6ec;font-weight:600}.mid{text-align:center;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0 12px}.date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.stars{font-weight:800;font-size:25px;letter-spacing:.015em;margin:3px 0;color:#f4f5ef;font-variant-numeric:tabular-nums}.stars span{color:var(--muted);font-size:14px;font-weight:500;padding:0 5px}.result{font-size:12px;font-weight:750;letter-spacing:.04em}.result.win{color:var(--green)}.result.loss{color:var(--red)}.result.none{color:var(--muted)}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.right .badges{justify-content:flex-end}.badge{border:1px solid #344b61;border-radius:99px;padding:3px 8px;font-size:10px;color:#c2d1db;white-space:nowrap}.badge.close{color:var(--gold);border-color:#665637}.badge.time{color:var(--blue);border-color:#365b76}
.empty{color:var(--muted);text-align:center;padding:40px 14px;border:1px dashed var(--line);border-radius:14px}.pager{display:flex;justify-content:center;align-items:center;gap:12px;padding:22px 0;color:var(--muted);font-variant-numeric:tabular-nums}.foot{border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:760px){.wrap{padding:22px 15px 40px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:14px;min-height:84px}.metric strong{font-size:25px}.war{grid-template-columns:minmax(0,1fr) minmax(112px,.72fr) minmax(0,1fr);gap:8px;padding:13px 10px}.club{font-size:14px}.side-meta{font-size:11px}.stars{font-size:21px}.mid{padding:0 6px}}
@media(max-width:480px){.wrap{padding:19px 12px 32px}.top{align-items:flex-start}.war{grid-template-columns:1fr 1fr;gap:10px}.mid{grid-column:1/-1;grid-row:2;border:0;border-top:1px solid var(--line);padding:9px 0 0}.right{text-align:right}.right .badges{justify-content:flex-end}input{width:min(100%,320px)}.filters{width:100%}.field.search{flex:1}.field.search input{width:100%}}
</style>
</head>
<body><main class="wrap">
<header><div class="top"><div class="brand"><span class="crest" aria-hidden="true">CF</span><span>Archivo de alianza · DomiStats</span></div><span>Temporada de guerras</span></div><h1>COLOMBIA FORCE</h1><p class="sub">Historial de enfrentamientos <strong id="rangeLabel"></strong></p></header>
<section class="metrics" aria-label="Resumen de resultados"><div class="metric"><label>Guerras cargadas</label><strong id="total">—</strong></div><div class="metric win"><label>Victorias</label><strong id="wins">—</strong></div><div class="metric loss"><label>Derrotas</label><strong id="losses">—</strong></div><div class="metric"><label>Gloria actual</label><strong id="gloryActual">—</strong></div></section>
<section class="toolbar" aria-label="Filtros del historial"><div class="filters"><div class="field search"><label for="query">Buscar rival</label><input id="query" type="search" placeholder="Nombre de alianza…" autocomplete="off"></div><div class="field"><label for="outcome">Resultado</label><select id="outcome"><option value="all">Todos</option><option value="win">Victoria</option><option value="loss">Derrota</option><option value="time">Time War</option><option value="close">Close War</option></select></div><div class="field"><label for="size">Tamaño</label><select id="size"><option value="all">Todos</option></select></div></div><button id="csv" type="button">Exportar CSV</button></section>
<div id="count" class="countline" aria-live="polite"></div><section id="list" class="list" aria-label="Guerras"></section><nav class="pager" aria-label="Paginación"><button id="prev" type="button">← Anterior</button><span id="pageText" aria-live="polite"></span><button id="next" class="primary" type="button">Siguiente →</button></nav>
<footer class="foot"><span>Las cifras reflejan las tarjetas leídas al recopilar el historial de <a href="https://domistats.com/alliance_wars/68105?page=1" target="_blank" rel="noreferrer">DomiStats</a>.</span></footer>
</main>
<script>
const WARS=__WARS_JSON__;
const PAGE_SIZE=15;
const $=id=>document.getElementById(id);
let page=1;
const resultOf=w=>w.result==="—"?"none":Number(w.result)>0?"win":Number(w.result)<0?"loss":"none";
const total=WARS.length,wins=WARS.filter(w=>resultOf(w)==="win").length,losses=WARS.filter(w=>resultOf(w)==="loss").length;
$("total").textContent=total.toLocaleString("es-CO");$("wins").textContent=wins.toLocaleString("es-CO");$("losses").textContent=losses.toLocaleString("es-CO");
const latestWar=WARS.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];$("gloryActual").textContent=latestWar?.left?.glory||"—";
const dates=WARS.map(w=>w.date).filter(Boolean).sort();$("rangeLabel").textContent=dates.length?"· "+dates[dates.length-1]+" — "+dates[0]:"";
[...new Set(WARS.map(w=>w.size).filter(Boolean))].sort().forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;$("size").append(o);});
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function hasNote(w,note){return String(w.notes||"").split(",").map(x=>x.trim()).includes(note);}
function visibleWars(){const q=$("query").value.trim().toLocaleLowerCase("es"),out=$("outcome").value,size=$("size").value;return WARS.filter(w=>(!q||w.right.name.toLocaleLowerCase("es").includes(q))&&(out==="all"||resultOf(w)===out||(out==="time"&&hasNote(w,"Time War"))||(out==="close"&&hasNote(w,"Close War")))&&(size==="all"||w.size===size));}
function card(w){const outcome=resultOf(w),label=outcome==="win"?"VICTORIA":outcome==="loss"?"DERROTA":"SIN DATO",classes=outcome==="win"?"win":outcome==="loss"?"loss":"none";const tags=[w.size,w.notes&&w.notes!=="—"?w.notes:""].filter(Boolean);const badge=t=>'<span class="badge '+(t==="Close War"?"close":t==="Time War"?"time":"")+'">'+esc(t)+'</span>';return '<article class="war"><div class="side"><div class="club">COLOMBIA FORCE</div><div class="side-meta">Rango <b>'+esc(w.left.rank)+'</b> · Gloria <b>'+esc(w.left.glory)+'</b></div><div class="side-meta">División <b>'+esc(w.left.division)+'</b></div><div class="badges">'+tags.map(badge).join("")+'</div></div><div class="mid"><div class="date">'+esc(w.date)+'</div><div class="stars">'+esc(w.stars[0]||"—")+'<span>★</span>'+esc(w.stars[1]||"—")+'</div><div class="result '+classes+'">'+label+' · Gloria '+esc(w.result)+'</div></div><div class="side right"><div class="club">'+esc(w.right.name)+'</div><div class="side-meta">Rango <b>'+esc(w.right.rank)+'</b> · Gloria <b>'+esc(w.right.glory)+'</b></div><div class="side-meta">División <b>'+esc(w.right.division)+'</b></div></div></article>';}
function render(){const filtered=visibleWars(),pages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));page=Math.min(page,pages);const start=(page-1)*PAGE_SIZE,slice=filtered.slice(start,start+PAGE_SIZE);$("count").textContent=filtered.length?"Mostrando "+(start+1)+"–"+(start+slice.length)+" de "+filtered.length+" guerras":"No hay guerras para estos filtros.";$("list").innerHTML=slice.length?slice.map(card).join(""):'<div class="empty">Prueba otra búsqueda o cambia los filtros.</div>';$("pageText").textContent="Página "+page+" de "+pages;$("prev").disabled=page<=1;$("next").disabled=page>=pages;$("next").classList.toggle("primary",page<pages);}
["query","outcome","size"].forEach(id=>$(id).addEventListener(id==="query"?"input":"change",()=>{page=1;render();}));$("prev").addEventListener("click",()=>{page=Math.max(1,page-1);render();});$("next").addEventListener("click",()=>{page++;render();});
$("csv").addEventListener("click",()=>{const head=["Fecha","Alianza rival","Rango CF","Rango rival","Gloria CF","Gloria rival","Division CF","Division rival","Gloria de guerra","Estrellas CF","Estrellas rival","Tamaño","Observacion"];const rows=visibleWars().map(w=>[w.date,w.right.name,w.left.rank,w.right.rank,w.left.glory,w.right.glory,w.left.division,w.right.division,w.result,w.stars[0],w.stars[1],w.size,w.notes]);const csv=[head,...rows].map(row=>row.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download="colombia-force-guerras.csv";a.click();URL.revokeObjectURL(a.href);});render();
</script></body></html>
