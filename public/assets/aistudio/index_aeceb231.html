function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function hasNote(w,note){return String(w.notes||"").split(",").map(x=>x.trim()).includes(note);}
function visibleWars(){const q=$("query").value.trim().toLocaleLowerCase("es"),out=$("outcome").value,size=$("size").value;return WARS.filter(w=>(!q||w.right.name.toLocaleLowerCase("es").includes(q))&&(out==="all"||resultOf(w)===out||(out==="time"&&hasNote(w,"Time War"))||(out==="close"&&hasNote(w,"Close War")))&&(size==="all"||w.size===size));}
function card(w){const outcome=resultOf(w),label=outcome==="win"?"VICTORIA":outcome==="loss"?"DERROTA":"SIN DATO",classes=outcome==="win"?"win":outcome==="loss"?"loss":"none";const tags=[w.size,w.notes&&w.notes!=="—"?w.notes:""].filter(Boolean);const badge=t=>'<span class="badge '+(t==="Close War"?"close":t==="Time War"?"time":"")+'">'+esc(t)+'</span>';return '<article class="war"><div class="side"><div class="club">COLOMBIA FORCE</div><div class="side-meta">Rango <b>'+esc(w.left.rank)+'</b> · Gloria <b>'+esc(w.left.glory)+'</b></div><div class="side-meta">División <b>'+esc(w.left.division)+'</b></div><div class="badges">'+tags.map(badge).join("")+'</div></div><div class="mid"><div class="date">'+esc(w.date)+'</div><div class="stars">'+esc(w.stars[0]||"—")+'<span>★</span>'+esc(w.stars[1]||"—")+'</div><div class="result '+classes+'">'+label+' · Gloria '+esc(w.result)+'</div></div><div class="side right"><div class="club">'+esc(w.right.name)+'</div><div class="side-meta">Rango <b>'+esc(w.right.rank)+'</b> · Gloria <b>'+esc(w.right.glory)+'</b></div><div class="side-meta">División <b>'+esc(w.right.division)+'</b></div></div></article>';}
function render(){const filtered=visibleWars(),pages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));page=Math.min(page,pages);const start=(page-1)*PAGE_SIZE,slice=filtered.slice(start,start+PAGE_SIZE);$("count").textContent=filtered.length?"Mostrando "+(start+1)+"–"+(start+slice.length)+" de "+filtered.length+" guerras":"No hay guerras para estos filtros.";$("list").innerHTML=slice.length?slice.map(card).join(""):'<div class="empty">Prueba otra búsqueda o cambia los filtros.</div>';$("pageText").textContent="Página "+page+" de "+pages;$("prev").disabled=page<=1;$("next").disabled=page>=pages;$("next").classList.toggle("primary",page<pages);}
["query","outcome","size"].forEach(id=>$(id).addEventListener(id==="query"?"input":"change",()=>{page=1;render();}));$("prev").addEventListener("click",()=>{page=Math.max(1,page-1);render();});$("next").addEventListener("click",()=>{page++;render();});
$("csv").addEventListener("click",()=>{const head=["Fecha","Alianza rival","Rango CF","Rango rival","Gloria CF","Gloria rival","Division CF","Division rival","Gloria de guerra","Estrellas CF","Estrellas rival","Tamaño","Observacion"];const rows=visibleWars().map(w=>[w.date,w.right.name,w.left.rank,w.right.rank,w.left.glory,w.right.glory,w.left.division,w.right.division,w.result,w.stars[0],w.stars[1],w.size,w.notes]);const csv=[head,...rows].map(row=>row.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download="colombia-force-guerras.csv";a.click();URL.revokeObjectURL(a.href);});render();
</script></body></html>
